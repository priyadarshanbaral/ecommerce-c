<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storefront - Products</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="alert"></div>
  <header>
    <div class="container top-bar">
      <a href="index.html" class="logo">STOREFRONT</a>
      <nav class="nav-links">
        <a href="index.html">Products</a>
        <a href="cart.html">Cart <span id="cart-badge" class="cart-badge" style="display:none"><span id="cart-count">0</span></span></a>
        <div id="auth-links" class="auth-links">
          <a href="auth.html" class="btn-outline">Login</a>
          <a href="auth.html" class="btn-primary">Register</a>
        </div>
        <div id="user-menu" style="display:none; gap:0.75rem; align-items:center">
          <span id="user-name" style="font-size:0.9rem;color:var(--muted)"></span>
          <a href="#" id="logout-btn" class="btn-outline">Logout</a>
        </div>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Shop great products</h1>
      <p>Browse our catalog, add items to your cart, and place your order.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-title"><span>📦</span> All Products</div>
      <div class="grid" id="product-grid">
        <div class="empty-state">Loading products&hellip;</div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">&copy; 2026 Storefront. Built for CodeAlpha e-commerce task.</div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const res = await fetch('/api/products', { credentials: 'include' });
        if (!res.ok) throw new Error('Failed to load products');
        const products = await res.json();
        if (!products || products.length === 0) {
          grid.innerHTML = '<div class="empty-state">No products available.</div>';
          return;
        }
        grid.innerHTML = products.map(p => `
          <article class="card">
            <div class="card-image">
              <img src="${p.image || 'https://placehold.co/400x400/e2e8f0/1f2937?text=Product'}" alt="${escapeHTML(p.name)}">
            </div>
            <div class="card-body">
              <div class="card-category">${escapeHTML(p.category || 'General')}</div>
              <h3 class="card-title">${escapeHTML(p.name)}</h3>
              <div class="card-price">${formatMoney(p.price)}</div>
              <div class="card-actions">
                <button class="btn-add" data-add="${p.id}">Add to Cart</button>
                <a href="product.html?id=${p.id}" class="btn-detail">Details</a>
              </div>
            </div>
          </article>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<div class="empty-state">Unable to load products. Please try again later.</div>';
        showAlert(err.message, 'error');
      }
    }

    function escapeHTML(str = '') {
      return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;" }[c]));
    }

    loadProducts();
  </script>
</body>
</html>
