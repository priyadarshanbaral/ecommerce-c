<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Storefront</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="alert"></div>
  <header>
    <div class="container top-bar">
      <a href="index.html" class="logo">STOREFRONT</a>
      <nav class="nav-links">
        <a href="index.html">Products</a>
        <a href="cart.html">Cart <span id="cart-badge" class="cart-badge" style="display:none"><span id="cart-count">0</span></span></a>
        <div id="auth-links" class="auth-links">
          <a href="auth.html" class="btn-outline">Login</a>
          <a href="auth.html" class="btn-primary">Register</a>
        </div>
        <div id="user-menu" style="display:none; gap:0.75rem; align-items:center">
          <span id="user-name" style="font-size:0.9rem;color:var(--muted)"></span>
          <a href="#" id="logout-btn" class="btn-outline">Logout</a>
        </div>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <a href="index.html" style="color:var(--muted);font-size:0.9rem;margin-bottom:1rem;display:inline-block;">&larr; Back to products</a>
      <div class="detail-header" id="product-container">
        <div class="empty-state">Loading product&hellip;</div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">&copy; 2026 Storefront.</div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    function escapeHTML(str = '') {
      return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;" }[c]));
    }

    async function loadProduct() {
      const container = document.getElementById('product-container');
      if (!id) {
        container.innerHTML = '<div class="empty-state">No product specified.</div>';
        return;
      }
      try {
        const res = await fetch(`/api/products/${id}`, { credentials: 'include' });
        if (!res.ok) throw new Error('Product not found');
        const p = await res.json();
        const img = p.image || 'https://placehold.co/400x400/e2e8f0/1f2937?text=Product';
        container.innerHTML = `
          <div class="detail-image">
            <img src="${img}" alt="${escapeHTML(p.name)}">
          </div>
          <div class="detail-info">
            <div class="detail-category">${escapeHTML(p.category || 'General')}</div>
            <h1 class="detail-title">${escapeHTML(p.name)}</h1>
            <div class="detail-price">${formatMoney(p.price)}</div>
            <div class="detail-description">${escapeHTML(p.description || '')}</div>
            <div class="detail-stock ${p.stock > 0 ? 'in-stock' : 'out-of-stock'}">
              ${p.stock > 0 ? `In stock (${p.stock} available)` : 'Out of stock'}
            </div>
            ${p.stock > 0 ? `
              <div class="qty-selector">
                <label for="qty-${p.id}">Quantity</label>
                <input type="number" id="qty-${p.id}" value="1" min="1" max="${p.stock}" data-qty-for="${p.id}">
              </div>
              <div class="detail-actions">
                <button class="btn-buy" data-add="${p.id}">Add to Cart</button>
              </div>
            ` : '<div class="out-of-stock">This product is currently unavailable.</div>'}
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Unable to load product. Please try again later.</div>';
        showAlert(err.message, 'error');
      }
    }

    loadProduct();
  </script>
</body>
</html>
