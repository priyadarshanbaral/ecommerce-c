<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Storefront</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="alert"></div>
  <header>
    <div class="container top-bar">
      <a href="index.html" class="logo">STOREFRONT</a>
      <nav class="nav-links">
        <a href="index.html">Products</a>
        <a href="cart.html">Cart <span id="cart-badge" class="cart-badge" style="display:none"><span id="cart-count">0</span></span></a>
        <div id="auth-links" class="auth-links">
          <a href="auth.html" class="btn-outline">Login</a>
          <a href="auth.html" class="btn-primary">Register</a>
        </div>
        <div id="user-menu" style="display:none; gap:0.75rem; align-items:center">
          <span id="user-name" style="font-size:0.9rem;color:var(--muted)"></span>
          <a href="#" id="logout-btn" class="btn-outline">Logout</a>
        </div>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="cart-header">
        <h2>Shopping Cart</h2>
        <a href="index.html" class="btn-outline">Continue Shopping</a>
      </div>

      <div class="cart-empty" id="cart-empty" style="display:none;text-align:center;padding:2rem;color:var(--muted)">
        Your cart is empty.
      </div>

      <table class="cart-table" id="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>

      <div class="cart-summary" id="cart-summary" style="display:none">
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span>Free</span></div>
        <div class="summary-row"><span>Total</span><span id="total">$0.00</span></div>
        <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">&copy; 2026 Storefront.</div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    async function escapeHTML(str = '') {
      return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;" }[c]));
    }

    async function loadCart() {
      const ok = await requireAuth();
      if (!ok) return;

      const empty = document.getElementById('cart-empty');
      const table = document.getElementById('cart-table');
      const summary = document.getElementById('cart-summary');
      const body = document.getElementById('cart-body');
      const subtotalEl = document.getElementById('subtotal');
      const totalEl = document.getElementById('total');
      const checkoutBtn = document.getElementById('checkout-btn');

      try {
        const items = await fetchJSON(`${API}/cart`);

        if (!items || items.length === 0) {
          empty.style.display = 'block';
          table.style.display = 'none';
          summary.style.display = 'none';
          return;
        }

        empty.style.display = 'none';
        table.style.display = 'table';
        summary.style.display = 'block';

        let subtotal = 0;
        body.innerHTML = items.map(item => {
          const lineTotal = (item.price || 0) * (item.quantity || 0);
          subtotal += lineTotal;
          const img = item.image || 'https://placehold.co/70x70/e2e8f0/1f2937?text=Product';
          return `
            <tr class="cart-row">
              <td>
                <div class="cart-item-image">
                  <img src="${img}" alt="${escapeHTML(item.name)}">
                </div>
                <div class="cart-item-name">${escapeHTML(item.name)}</div>
              </td>
              <td>${formatMoney(item.price)}</td>
              <td>
                <input type="number" class="cart-qty" value="${item.quantity}" min="0" data-pid="${item.product_id}">
              </td>
              <td>${formatMoney(lineTotal)}</td>
              <td><a href="#" class="cart-item-remove" data-pid="${item.product_id}">Remove</a></td>
            </tr>
          `;
        }).join('');

        subtotalEl.textContent = formatMoney(subtotal);
        totalEl.textContent = formatMoney(subtotal);

        body.querySelectorAll('.cart-qty').forEach(input => {
          input.addEventListener('change', async () => {
            const pid = input.dataset.pid;
            const qty = parseInt(input.value, 10) || 0;
            try {
              await fetchJSON(`${API}/cart/update`, { method: 'POST', body: JSON.stringify({ product_id: pid, quantity: qty }) });
              await loadCartCount();
              loadCart();
            } catch (err) { showAlert(err.message, 'error'); }
          });
        });

        body.querySelectorAll('.cart-item-remove').forEach(link => {
          link.addEventListener('click', async (e) => {
            e.preventDefault();
            const pid = link.dataset.pid;
            try {
              await fetchJSON(`${API}/cart/remove`, { method: 'POST', body: JSON.stringify({ product_id: pid }) });
              await loadCartCount();
              loadCart();
            } catch (err) { showAlert(err.message, 'error'); }
          });
        });

        checkoutBtn.onclick = () => { window.location.pathname = '/checkout.html'; };
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    loadCart();
  </script>
</body>
</html>
